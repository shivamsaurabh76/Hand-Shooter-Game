name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-deps:
    name: Lint & Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Ubuntu 24.04 (Noble): libgl1-mesa-glx was removed
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglx-mesa0 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev \
            libgomp1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check — all Python files
        run: |
          echo "Checking syntax..."
          python -m py_compile app.py   && echo "  OK: app.py"
          python -m py_compile game.py  && echo "  OK: game.py"
          for f in src/*.py; do
            python -m py_compile "$f"   && echo "  OK: $f"
          done
          echo "All syntax checks passed ✅"

      # PYTHONPATH=. is REQUIRED so 'import src' resolves from repo root
      - name: Import smoke test
        env:
          PYTHONPATH: "."
          CI: "true"
        run: |
          python - <<'PYEOF'
          import cv2
          # Patch camera — CI has no webcam
          cv2.VideoCapture = lambda *a, **k: None

          from src.colors           import C
          from src.config           import MODE_CONFIGS, MODE_ORDER, GameState
          from src.math_utils       import MathUtils
          from src.particles        import ParticleSystem
          from src.score_popup      import ScorePopup
          from src.target_ball      import TargetBall
          from src.hud              import HUD
          from src.sound_engine     import SoundEngine
          from src.menu             import MenuScreen

          # Validate mode configs
          assert set(MODE_ORDER) == {"classic", "time_attack", "practice"}, \
              f"Wrong modes: {MODE_ORDER}"
          for k in MODE_ORDER:
              cfg = MODE_CONFIGS[k]
              for required in ("description", "icon_color", "key_hint",
                               "ball_size", "ball_speed", "has_timer"):
                  assert required in cfg, f"Missing '{required}' in mode '{k}'"

          # Sound engine must be silent in CI (no audio device)
          se = SoundEngine()
          assert se._mode == "silent", \
              f"Expected silent in CI, got: {se._mode}"
          print(f"  SoundEngine mode: {se._mode} ✅ (correct for CI)")

          print("\n✅ All imports and assertions passed")
          print(f"   Modes: {MODE_ORDER}")
          PYEOF

      - name: Verify packages.txt entries exist in apt
        run: |
          echo "Verifying packages.txt..."
          while IFS= read -r pkg || [[ -n "$pkg" ]]; do
            [[ -z "$pkg" || "$pkg" == \#* ]] && continue
            if apt-cache show "$pkg" > /dev/null 2>&1; then
              echo "  OK: $pkg"
            else
              echo "  ❌ MISSING: $pkg"
              exit 1
            fi
          done < packages.txt
          echo "All packages valid ✅"