name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-deps:
    name: Lint & Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Ubuntu 24.04 (Noble): libgl1-mesa-glx was removed
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglx-mesa0 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev \
            libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check — all Python files (recursive)
        run: |
          echo "Checking syntax (recursive)..."
          python - <<'PY'
          import sys
          from pathlib import Path

          files = sorted(Path(".").rglob("*.py"))
          if not files:
              print("No .py files found")
              sys.exit(1)

          for f in files:
              try:
                  compile(f.read_text(encoding="utf-8"), str(f), "exec")
              except Exception as e:
                  print(f"❌ Syntax error in {f}: {e}")
                  raise
              else:
                  print(f"  OK: {f}")
          print("\n✅ All syntax checks passed")
          PY

      - name: Import smoke test (repo layout)
        env:
          PYTHONPATH: "."
          CI: "true"
        run: |
          python - <<'PY'
          # Validate imports from app/game.py (this is the real module in this repo)
          from app.game import (
              C,
              GameState,
              MODE_CONFIGS,
              MODE_ORDER,
              MathUtils,
              ParticleSystem,
              ScorePopup,
              TargetBall,
              HUD,
              SoundEngine,
              MenuScreen,
              HandTrackingGame,
          )

          # Validate mode configs
          assert set(MODE_ORDER) == {"classic", "time_attack", "practice"}, f"Wrong modes: {MODE_ORDER}"
          for k in MODE_ORDER:
              cfg = MODE_CONFIGS[k]
              for required in ("description", "icon_color", "key_hint", "ball_size", "ball_speed", "has_timer"):
                  assert required in cfg, f"Missing '{required}' in mode '{k}'"

          # Sound engine should be silent in CI (no audio device)
          se = SoundEngine()
          assert se._mode == "silent", f"Expected silent in CI, got: {se._mode}"

          # Basic sanity: class is constructible (doesn't open webcam in __init__)
          _ = HandTrackingGame(width=320, height=240)

          print("✅ app.game imports + assertions passed")
          print(f"   Modes: {MODE_ORDER}")
          print(f"   SoundEngine mode: {se._mode}")
          PY

      - name: Import smoke test (Streamlit entrypoint module-style import)
        env:
          # app/main.py does: `from game import HandTrackingGame`
          # so we add ./app to PYTHONPATH to make `game` resolve.
          PYTHONPATH: "./app"
          CI: "true"
        run: |
          python - <<'PY'
          # Ensure Streamlit entrypoint can be imported without crashing the interpreter
          import main  # noqa: F401
          print("✅ app/main.py import passed (PYTHONPATH=./app)")
          PY

      - name: Verify packages.txt entries exist in apt
        run: |
          echo "Verifying packages.txt..."
          while IFS= read -r pkg || [[ -n "$pkg" ]]; do
            [[ -z "$pkg" || "$pkg" == \#* ]] && continue
            if apt-cache show "$pkg" > /dev/null 2>&1; then
              echo "  OK: $pkg"
            else
              echo "  ❌ MISSING: $pkg"
              exit 1
            fi
          done < packages.txt
          echo "✅ All packages valid"