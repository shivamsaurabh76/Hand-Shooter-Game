name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    name: Lint and Import Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check main entrypoint
        run: |
          python -m py_compile app/main.py
          echo "OK: app/main.py"

      - name: Syntax check legacy module
        run: |
          python -m py_compile app/game.py
          echo "OK: app/game.py"

      - name: Import smoke test Streamlit entrypoint
        env:
          CI: "true"
        run: |
          python - <<'PYEOF'
          import sys
          import types

          st = types.ModuleType("streamlit")

          class FakeCtx:
              headers = {}
          st.context = FakeCtx()
          st.set_page_config = lambda **kw: None
          st.markdown = lambda *a, **kw: None
          st.error = lambda *a, **kw: None

          class FakeExpander:
              def __enter__(self):
                  return self
              def __exit__(self, *a):
                  return False

          st.expander = lambda *a, **kw: FakeExpander()
          sys.modules["streamlit"] = st

          import importlib.util
          spec = importlib.util.spec_from_file_location("main", "app/main.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          print("OK: app/main.py imported without errors")
          PYEOF

      - name: Verify game HTML has required content
        run: |
          python - <<'PYEOF'
          from pathlib import Path
          html = Path("app/static/game.html").read_text(encoding="utf-8")
          assert "HandLandmarker" in html, "Missing HandLandmarker"
          assert "START" in html, "Missing START button"
          assert "STOP" in html, "Missing STOP button"
          assert "delegate" in html, "Missing delegate config"
          print("OK: app/static/game.html content verified")
          PYEOF
