name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    name: Lint & Import Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check — app/main.py
        run: python -m py_compile app/main.py && echo "OK: app/main.py"

      - name: Syntax check — app/game.py
        run: python -m py_compile app/game.py && echo "OK: app/game.py"

      - name: Import smoke test — Streamlit entrypoint
        env:
          CI: "true"
        run: |
          python - <<'PY'
          import sys, importlib.util, types

          # Stub streamlit so we don't need a running server
          st = types.ModuleType("streamlit")
          class _Ctx:
              headers = {}
          st.context = _Ctx()
          st.set_page_config = lambda **kw: None
          st.markdown = lambda *a, **kw: None
          st.expander = lambda *a, **kw: _Ctx()
          st.error = lambda *a, **kw: None
          _Ctx.__enter__ = lambda s: s
          _Ctx.__exit__ = lambda s, *a: None
          sys.modules["streamlit"] = st

          spec = importlib.util.spec_from_file_location("main", "app/main.py")
          mod  = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          print("OK: app/main.py imported cleanly")
          PY

      - name: Verify game.html exists and has required content
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("app/static/game.html").read_text()
          assert "HandLandmarker" in html, "Missing HandLandmarker in game.html"
          assert "START" in html,          "Missing START button in game.html"
          assert "STOP"  in html,          "Missing STOP button in game.html"
          print("OK: app/static/game.html looks correct")
          PY
