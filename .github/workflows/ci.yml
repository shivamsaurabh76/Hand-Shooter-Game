# ── GitHub Actions CI ────────────────────────────────────────────────
# Fixed for Ubuntu 24.04 (Noble): libgl1-mesa-glx → libgl1 + libglx-mesa0

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-deps:
    name: Lint & Dependency Check
    runs-on: ubuntu-latest        # Ubuntu 24.04 (Noble) as of 2024
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── Ubuntu 24.04 fix ─────────────────────────────────────────
      # libgl1-mesa-glx was REMOVED in Ubuntu 24.04 (Noble).
      # Replace with: libgl1 (provides libGL.so.1) + libglx-mesa0
      - name: Install system dependencies (Ubuntu 24.04 compatible)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglx-mesa0 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev \
            libgomp1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check — all Python files
        run: |
          echo "Checking syntax..."
          python -m py_compile app.py      && echo "  OK: app.py"
          python -m py_compile game.py     && echo "  OK: game.py"
          for f in src/*.py; do
            python -m py_compile "$f"      && echo "  OK: $f"
          done
          echo "All syntax checks passed ✅"

      - name: Import smoke test
        run: |
          python - <<'PYEOF'
          # Patch cv2.VideoCapture so no camera is needed in CI
          import cv2
          cv2.VideoCapture = lambda *a, **k: None

          from src.colors           import C
          from src.config           import MODE_CONFIGS, MODE_ORDER, GameState
          from src.math_utils       import MathUtils
          from src.particles        import ParticleSystem
          from src.score_popup      import ScorePopup
          from src.target_ball      import TargetBall
          from src.hud              import HUD
          from src.sound_engine     import SoundEngine
          from src.menu             import MenuScreen

          # Quick sanity assertions
          assert set(MODE_ORDER) == {"classic", "time_attack", "practice"}
          for k in MODE_ORDER:
              cfg = MODE_CONFIGS[k]
              assert "description" in cfg, f"Missing description in {k}"
              assert "icon_color"  in cfg, f"Missing icon_color in {k}"
              assert "key_hint"    in cfg, f"Missing key_hint in {k}"

          se = SoundEngine()
          print(f"  SoundEngine backend: {se._mode}")

          print("\nAll src modules imported and validated ✅")
          print(f"  Modes: {MODE_ORDER}")
          PYEOF

      - name: Verify packages.txt only has Ubuntu 24.04 packages
        run: |
          echo "Verifying packages.txt..."
          while IFS= read -r pkg || [[ -n "$pkg" ]]; do
            [[ -z "$pkg" || "$pkg" == \#* ]] && continue
            if apt-cache show "$pkg" > /dev/null 2>&1; then
              echo "  OK: $pkg"
            else
              echo "  MISSING: $pkg — not found in apt cache!"
              exit 1
            fi
          done < packages.txt
          echo "All packages.txt entries valid ✅"