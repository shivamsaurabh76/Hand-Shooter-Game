[server]
headless = true
enableCORS = false
enableXsrfProtection = false
enableStaticServing = true
port = 5000

[theme]
base = "dark"
backgroundColor = "#0a0a14"
secondaryBackgroundColor = "#14141f"
textColor = "#e8e8f0"
primaryColor = "#FFD700"

[runner]
fastReruns = true

[logger]
level = "warning"
